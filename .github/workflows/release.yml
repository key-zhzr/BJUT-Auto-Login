name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'windows-latest'
            args: '--target aarch64-pc-windows-msvc'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc -c tauri.offline.conf.json'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NPM dependencies
        run: npm ci

      - name: Get version
        id: get_version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.get_version.outputs.version }}"

      - name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Rename and Prepare Assets
        shell: python
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARGS: ${{ matrix.args }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          import os
          import shutil
          import sys

          platform = os.environ.get("MATRIX_PLATFORM", "")
          args = os.environ.get("MATRIX_ARGS", "")
          version = os.environ.get("VERSION", "")

          os.makedirs("release-artifacts", exist_ok=True)
          print("Searching for Windows artifacts on platform={}, args={}, version={}...".format(platform, args, version))

          copied = False
          for root, dirs, files in os.walk("src-tauri/target"):
              if "debug" in root.split(os.sep):
                  continue
              for file in files:
                  file_path = os.path.join(root, file)

                  if file.endswith(".exe") and "bundle" in file_path:
                      arch = "arm64" if "aarch64" in args else "x64"
                      suffix = "_Offline" if "tauri.offline.conf.json" in args else ""
                      dest = "release-artifacts/BJUT-Auto-Login_{}_Windows_{}{}.exe".format(version, arch, suffix)
                      print("Found Windows EXE: {} -> {}".format(file_path, dest))
                      shutil.copy2(file_path, dest)
                      copied = True
                  elif file.endswith(".exe.sig") and "bundle" in file_path and "tauri.offline.conf.json" not in args:
                      arch = "arm64" if "aarch64" in args else "x64"
                      dest = "release-artifacts/BJUT-Auto-Login_{}_Windows_{}.exe.sig".format(version, arch)
                      print("Found Windows EXE signature: {} -> {}".format(file_path, dest))
                      shutil.copy2(file_path, dest)
                      copied = True

          if not copied:
              print("Error: No Windows artifacts were found!")
              sys.exit(1)
          else:
              print("Successfully copied all artifacts.")

      - name: Upload Local Artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts-${{ matrix.platform }}-${{ strategy.job-index }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    needs: [build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get version
        id: get_version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-release-artifacts

      - name: Flatten folder structure
        shell: python
        run: |
          import os
          import shutil

          src_dir = "all-release-artifacts"
          dest_dir = "release-files"
          os.makedirs(dest_dir, exist_ok=True)

          print("Flattening files from {} to {}...".format(src_dir, dest_dir))
          file_count = 0
          for root, dirs, files in os.walk(src_dir):
              for file in files:
                  src_path = os.path.join(root, file)
                  dest_path = os.path.join(dest_dir, file)
                  print("Copying {} -> {}".format(src_path, dest_path))
                  shutil.copy2(src_path, dest_path)
                  file_count += 1

          print("Successfully flattened {} files.".format(file_count))
          if file_count == 0:
              raise Exception("No release files were found to upload!")

      - name: Generate signed updater manifest
        shell: python
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          base = "https://github.com/{}/releases/download/v{}".format(repository, version)
          release_dir = "release-files"
          targets = {
              "windows-aarch64": "BJUT-Auto-Login_{}_Windows_arm64.exe".format(version),
              "windows-x86_64": "BJUT-Auto-Login_{}_Windows_x64.exe".format(version),
          }
          platforms = {}
          for target, filename in targets.items():
              artifact = os.path.join(release_dir, filename)
              signature = artifact + ".sig"
              if not os.path.isfile(artifact) or not os.path.isfile(signature):
                  raise SystemExit("Missing updater artifact or signature for {}: {}".format(target, filename))
              with open(signature, "r", encoding="utf-8") as handle:
                  signature_text = handle.read().strip()
              platforms[target] = {
                  "url": "{}/{}".format(base, filename),
                  "signature": signature_text,
                  "size": os.path.getsize(artifact),
              }
          manifest = {
              "version": version,
              "notes": "完整更新说明请查看本 GitHub Release。",
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "platforms": platforms,
              "assets": [
                  {"name": filename, "browser_download_url": "{}/{}".format(base, filename),
                   "size": os.path.getsize(os.path.join(release_dir, filename))}
                  for filename in sorted(os.listdir(release_dir))
                  if filename.endswith((".exe", ".exe.sig"))
              ],
          }
          with open(os.path.join(release_dir, "latest.json"), "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: 'BJUT-Auto-Login v${{ steps.get_version.outputs.version }}'
          draft: true
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
